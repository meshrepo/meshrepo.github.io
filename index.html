<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Repository</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card: #1c1c1f;
            --text: #ffffff;
            --accent: #3b82f6;
            --border: #2a2a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p.subtitle { color: #a1a1aa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .card-img-container {
            width: 100%;
            height: 220px;
            background: #141417;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content { padding: 1.2rem; text-align: center; }
        .card-title { font-size: 1.15rem; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.1rem; color: #4ade80; font-weight: bold; }

        /* CONTAINED MODAL OVERLAY */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 1000px; 
            height: 75vh;      
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #fff;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            cursor: pointer;
            z-index: 20;
            display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { background: #ef4444; }

        .modal-viewer {
            width: 100%;
            flex-grow: 1; 
            background: #18181b; 
            position: relative;
        }
        
        /* FLOATING THUMBNAIL OVERLAY */
        .modal-thumbnail-float {
            position: absolute;
            top: 20px; 
            left: 20px;
            width: 200px; 
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 10; 
            overflow: hidden;
        }
        .modal-thumbnail-float img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* GLB Model Viewer Styling */
        model-viewer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 6;
            outline: none;
            background-color: transparent; 
        }

        .modal-info {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
        .modal-text h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .modal-text .price { font-size: 1.3rem; color: #4ade80; font-weight: bold; }
        .modal-buy-container { min-width: 160px; text-align: right; }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            .modal-overlay { padding: 0.5rem; }
            .modal-content { height: 85vh; }
            .modal-thumbnail-float { 
                width: 120px; 
                top: 10px; 
                left: 10px; 
            }
            .modal-info { flex-direction: column; text-align: center; }
            .modal-buy-container { text-align: center; width: 100%; margin-top: 1rem; }
        }
    </style>
    
    <!-- Clean, lightweight GLB Engine (Google Model-Viewer) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <header>
        <h1>Mesh Repository</h1>
        <p class="subtitle">Interactive 3D Viewport. Polygons unlocked upon purchase.</p>
    </header>

    <div class="grid" id="catalogGrid"></div>

    <!-- MODAL HTML -->
    <div class="modal-overlay" id="assetModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(event)">&times;</button>
            
            <div class="modal-viewer" id="modalViewerTarget"></div>
            
            <div class="modal-info">
                <div class="modal-text">
                    <h2 id="modalTitle">Asset Title</h2>
                    <div class="price" id="modalPrice">₹0</div>
                </div>
                <div class="modal-buy-container" id="modalBuyBtn"></div>
            </div>
        </div>
    </div>

    <script>
        let currentModels = [];

        fetch('models.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '';

                currentModels = Array.isArray(data) ? data : (data.models || data.items || []);

                if (!Array.isArray(currentModels) || currentModels.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #a1a1aa;">No models found in catalog.</p>';
                    return;
                }

                currentModels.forEach((model, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(index);

                    // Smart Price Formatter for the Grid Cards
                    const rawPrice = model.price || '0';
                    const formattedPrice = rawPrice.toString().includes('₹') ? rawPrice : '₹' + rawPrice;

                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${model.thumbnail}" class="card-img" alt="${model.title}">
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${model.title}</h2>
                            <div class="card-price">${formattedPrice}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error("Catalog error:", err);
                document.getElementById('catalogGrid').innerHTML = '<p style="text-align:center; color:#f87171; grid-column: 1/-1;">Error loading storefront catalog.</p>';
            });

        function openModal(index) {
            const model = currentModels[index];
            if (!model) return;

            // Smart Price Formatter for the Modal
            const rawPrice = model.price || '0';
            const formattedPrice = rawPrice.toString().includes('₹') ? rawPrice : '₹' + rawPrice;

            document.getElementById('modalTitle').innerText = model.title;
            document.getElementById('modalPrice').innerText = formattedPrice;

            const viewerTarget = document.getElementById('modalViewerTarget');
            
            viewerTarget.innerHTML = `
                <div class="modal-thumbnail-float">
                    <img src="${model.thumbnail}" alt="${model.title} Thumbnail">
                </div>
            `;

            const btnContainer = document.getElementById('modalBuyBtn');
            btnContainer.innerHTML = ''; 

            if (model.buttonId && model.buttonId.startsWith('pl_')) {
                const form = document.createElement('form');
                const script = document.createElement('script');
                script.src = "https://checkout.razorpay.com/v1/payment-button.js";
                script.setAttribute("data-payment_button_id", model.buttonId);
                script.async = true;
                form.appendChild(script);
                btnContainer.appendChild(form);
            } else {
                btnContainer.innerHTML = '<span style="color: #f87171;">Payment unavailable</span>';
            }

            document.getElementById('assetModal').style.display = 'flex';

            if (model.glbUrl) {
                viewerTarget.innerHTML += `<model-viewer src="${model.glbUrl}" alt="${model.title}" camera-controls auto-rotate shadow-intensity="1" exposure="1.2" tone-mapping="neutral" interaction-prompt-threshold="0"></model-viewer>`;
            }
        }

        function closeModal(event) {
            if (event && event.target.className === 'modal-content') return;
            
            document.getElementById('assetModal').style.display = 'none';
            document.getElementById('modalViewerTarget').innerHTML = ''; 
        }
    </script>
</body>
</html>
