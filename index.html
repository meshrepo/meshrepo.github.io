<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Repository</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card: #1c1c1f;
            --text: #ffffff;
            --accent: #3b82f6;
            --border: #2a2a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p.subtitle { color: #a1a1aa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .card-img-container {
            width: 100%;
            height: 220px;
            background: #141417;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content { padding: 1.2rem; text-align: center; }
        .card-title { font-size: 1.15rem; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.1rem; color: #4ade80; font-weight: bold; }

        /* MODAL OVERLAY */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #fff;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            cursor: pointer;
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { background: #ef4444; }

        .modal-viewer {
            width: 100%;
            height: 400px;
            background: #000;
            position: relative;
        }
        .modal-viewer canvas {
            position: absolute !important;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
            z-index: 5 !important; 
        }
        .modal-fallback-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        .modal-info {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .modal-text h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .modal-text .price { font-size: 1.3rem; color: #4ade80; font-weight: bold; }
        .modal-buy-container { min-width: 160px; text-align: right; }

        @media (max-width: 600px) {
            .modal-info { flex-direction: column; text-align: center; }
            .modal-buy-container { text-align: center; width: 100%; margin-top: 1rem; }
            .modal-viewer { height: 300px; }
        }
    </style>
    
    <!-- Required Three.js Dependency -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/three.min.js"></script>
    <!-- Verified MK Kellogg Gaussian Splats 3D Viewer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d/build/gaussian-splats-3d.umd.js"></script>
</head>
<body>

    <header>
        <h1>Mesh Repository</h1>
        <p class="subtitle">Interactive 3D Viewport. Polygons unlocked upon purchase.</p>
    </header>

    <div class="grid" id="catalogGrid"></div>

    <!-- MODAL HTML -->
    <div class="modal-overlay" id="assetModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(event)">&times;</button>
            
            <div class="modal-viewer" id="modalViewerTarget"></div>
            
            <div class="modal-info">
                <div class="modal-text">
                    <h2 id="modalTitle">Asset Title</h2>
                    <div class="price" id="modalPrice">₹0</div>
                </div>
                <div class="modal-buy-container" id="modalBuyBtn"></div>
            </div>
        </div>
    </div>

    <script>
        let currentModels = [];
        let currentSplatViewer = null;

        fetch('models.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '';

                currentModels = Array.isArray(data) ? data : (data.models || data.items || []);

                if (!Array.isArray(currentModels) || currentModels.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #a1a1aa;">No models found in catalog.</p>';
                    return;
                }

                currentModels.forEach((model, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(index);

                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${model.thumbnail}" class="card-img" alt="${model.title}">
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${model.title}</h2>
                            <div class="card-price">${model.price}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error("Catalog error:", err);
                document.getElementById('catalogGrid').innerHTML = '<p style="text-align:center; color:#f87171; grid-column: 1/-1;">Error loading storefront catalog.</p>';
            });

        function openModal(index) {
            const model = currentModels[index];
            if (!model) return;

            document.getElementById('modalTitle').innerText = model.title;
            document.getElementById('modalPrice').innerText = model.price;

            const viewerTarget = document.getElementById('modalViewerTarget');
            viewerTarget.innerHTML = `<img src="${model.thumbnail}" class="modal-fallback-img" alt="${model.title}">`;

            const btnContainer = document.getElementById('modalBuyBtn');
            btnContainer.innerHTML = ''; 

            if (model.buttonId && model.buttonId.startsWith('pl_')) {
                const form = document.createElement('form');
                const script = document.createElement('script');
                script.src = "https://checkout.razorpay.com/v1/payment-button.js";
                script.setAttribute("data-payment_button_id", model.buttonId);
                script.async = true;
                form.appendChild(script);
                btnContainer.appendChild(form);
            } else {
                btnContainer.innerHTML = '<span style="color: #f87171;">Payment unavailable</span>';
            }

            document.getElementById('assetModal').style.display = 'flex';

            if (model.splatUrl) {
                if (window.GaussianSplats3D) {
                    try {
                        currentSplatViewer = new GaussianSplats3D.Viewer({
                            'rootElement': viewerTarget,
                            'cameraUp': [0, 1, 0],
                            'initialCameraPosition': [0, 1.2, 2.5],
                            'initialCameraLookAt': [0, 0, 0],
                            'sharedMemoryForWorkers': false 
                        });
                        
                        currentSplatViewer.addSplatScene(model.splatUrl, {
                            'showLoadingUI': false
                        }).then(() => {
                            currentSplatViewer.start();
                            console.log("SUCCESS: 3D Splat Viewer initialized.");
                        });
                    } catch (err) {
                        console.error("CRITICAL: The 3D Viewer crashed.", err);
                    }
                } else {
                    console.error("CRITICAL: The WebGL Splat script failed to load. Check if Three.js is loaded correctly.");
                }
            }
        }

        function closeModal(event) {
            if (event && event.target.className === 'modal-content') return;
            
            document.getElementById('assetModal').style.display = 'none';
            
            if (currentSplatViewer) {
                try {
                    currentSplatViewer.dispose();
                } catch(e) {}
                currentSplatViewer = null;
            }
            document.getElementById('modalViewerTarget').innerHTML = ''; 
        }
    </script>
</body>
</html>
