<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Repository</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Mesh Repository</h1>
            <p>Usable 3D models for your projects.</p>
            <a href="https://instagram.com/your_handle" target="_blank" class="ig-link">@your_handle</a>
        </div>
    </header>

    <main>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Assets</button>
        </div>

        <div class="grid" id="product-grid">
            <!-- Asset Card 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Sci-Fi+Crate+Model" alt="Sci-Fi Crate Model">
                <div class="card-content">
                    <h2>Sci-Fi Crate Model</h2>
                    <p class="price">$15.00</p>
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>

            <!-- Asset Card 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Low+Poly+Tree+Pack" alt="Low Poly Tree Pack">
                <div class="card-content">
                    <h2>Low Poly Tree Pack</h2>
                    <p class="price">$10.00</p>
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>

            <!-- Asset Card 3 -->
            <div class="card">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Hard+Surface+Kitbash" alt="Hard Surface Kitbash">
                <div class="card-content">
                    <h2>Hard Surface Kitbash</h2>
                    <p class="price">$25.00</p>
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
