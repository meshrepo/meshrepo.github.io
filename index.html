<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Repository</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card: #1c1c1f;
            --text: #ffffff;
            --accent: #3b82f6;
            --border: #2a2a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p.subtitle { color: #a1a1aa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .viewer-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #141417;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viewer-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
        }
        .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.15rem; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.1rem; color: #4ade80; font-weight: bold; margin-bottom: 1.2rem; }

        .buy-btn {
            margin-top: auto;
            display: block;
            text-align: center;
            padding: 0.8rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #2563eb; }
    </style>
    <!-- Lightweight WebGL Splat Viewer Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@antimatter15/splat@0.0.3/dist/splat.js"></script>
</head>
<body>

    <header>
        <h1>Mesh Repository</h1>
        <p class="subtitle">Interactive 3D Viewport. Polygons unlocked upon purchase.</p>
    </header>

    <div class="grid" id="catalogGrid"></div>

    <script>
        fetch('models.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '';

                let models = Array.isArray(data) ? data : (data.models || data.items || []);

                if (!Array.isArray(models) || models.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #a1a1aa;">No models found in catalog.</p>';
                    return;
                }

                models.forEach(model => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const viewerId = `splat-view-${model.id}`;
                    
                    // Build the card HTML without the button first
                    card.innerHTML = `
                        <div class="viewer-container" id="${viewerId}">
                            ${!model.splatUrl ? `<img src="${model.thumbnail}" alt="${model.title}" style="max-width:100%; max-height:100%; object-fit:contain;">` : ''}
                        </div>
                        <div class="card-content" id="content-${model.id}">
                            <h2 class="card-title">${model.title}</h2>
                            <div class="card-price">${model.price}</div>
                            <div class="rzp-button-container" style="margin-top: auto; text-align: center; min-height: 45px;"></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Dynamically inject the Razorpay script so the browser executes it
                    const btnContainer = card.querySelector('.rzp-button-container');
                    const targetId = model.buttonId || model.buyUrl; // Fallback support

                    if (targetId && targetId.startsWith('pl_')) {
                        const form = document.createElement('form');
                        const script = document.createElement('script');
                        script.src = "https://checkout.razorpay.com/v1/payment-button.js";
                        script.setAttribute("data-payment_button_id", targetId);
                        script.async = true;
                        form.appendChild(script);
                        btnContainer.appendChild(form);
                    } else if (targetId) {
                        // Fallback just in case an old normal link is still in the database
                        btnContainer.innerHTML = `<a href="${targetId}" class="buy-btn" target="_blank" rel="noopener noreferrer">Buy Now</a>`;
                    }

                    // Initialize WebGL Splat viewer for this card
                    if (model.splatUrl && window.Splat) {
                        const container = document.getElementById(viewerId);
                        const viewer = new Splat.Viewer({
                            target: container,
                            url: model.splatUrl,
                            camera: { position: [0, 1.2, 2.5], target: [0, 0, 0] }
                        });
                    }
                });
            })
            .catch(err => {
                console.error("Catalog error:", err);
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '<p style="text-align:center; color:#f87171; grid-column: 1/-1;">Error loading storefront catalog.</p>';
            });
    </script>
</body>
</html>
