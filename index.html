<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Repository</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card: #1c1c1f;
            --text: #ffffff;
            --accent: #3b82f6;
            --border: #2a2a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        p.subtitle { color: #a1a1aa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .viewer-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #141417;
            overflow: hidden;
        }
        /* Thumbnail layer sits in the back */
        .viewer-fallback-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        /* 3D viewer layer sits on top */
        .viewer-splat-target {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        .viewer-splat-target canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
        }
        .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.15rem; margin-bottom: 0.5rem; }
        .card-price { font-size: 1.1rem; color: #4ade80; font-weight: bold; margin-bottom: 1.2rem; }

        .rzp-button-container {
            margin-top: auto; 
            text-align: center; 
            min-height: 45px;
        }
    </style>
    <!-- Lightweight WebGL Splat Viewer Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@antimatter15/splat@0.0.3/dist/splat.js"></script>
</head>
<body>

    <header>
        <h1>Mesh Repository</h1>
        <p class="subtitle">Interactive 3D Viewport. Polygons unlocked upon purchase.</p>
    </header>

    <div class="grid" id="catalogGrid"></div>

    <script>
        fetch('models.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '';

                let models = Array.isArray(data) ? data : (data.models || data.items || []);

                if (!Array.isArray(models) || models.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #a1a1aa;">No models found in catalog.</p>';
                    return;
                }

                models.forEach(model => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const targetId = `splat-target-${model.id}`;
                    
                    // The thumbnail image is now ALWAYS rendered in the back
                    card.innerHTML = `
                        <div class="viewer-container">
                            <img src="${model.thumbnail}" alt="${model.title}" class="viewer-fallback-img" onerror="this.style.display='none'">
                            <div class="viewer-splat-target" id="${targetId}"></div>
                        </div>
                        <div class="card-content" id="content-${model.id}">
                            <h2 class="card-title">${model.title}</h2>
                            <div class="card-price">${model.price}</div>
                            <div class="rzp-button-container" id="rzp-btn-${model.id}"></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Inject the exact Razorpay Button snippet
                    const btnContainer = document.getElementById(`rzp-btn-${model.id}`);
                    const btnId = model.buttonId;

                    if (btnId && btnId.startsWith('pl_')) {
                        const form = document.createElement('form');
                        const script = document.createElement('script');
                        script.src = "https://checkout.razorpay.com/v1/payment-button.js";
                        script.setAttribute("data-payment_button_id", btnId);
                        script.async = true;
                        form.appendChild(script);
                        btnContainer.appendChild(form);
                    } else {
                        btnContainer.innerHTML = '<span style="color: #f87171; font-size: 0.9rem;">Payment unavailable</span>';
                    }

                    // Initialize WebGL Splat viewer for this card on top of the image
                    if (model.splatUrl && typeof Splat !== 'undefined') {
                        const container = document.getElementById(targetId);
                        try {
                            const viewer = new Splat.Viewer({
                                target: container,
                                url: model.splatUrl,
                                camera: { position: [0, 1.2, 2.5], target: [0, 0, 0] }
                            });
                        } catch (err) {
                            console.error("Failed to load 3D Splat for " + model.title, err);
                        }
                    }
                });
            })
            .catch(err => {
                console.error("Catalog error:", err);
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = '<p style="text-align:center; color:#f87171; grid-column: 1/-1;">Error loading storefront catalog.</p>';
            });
    </script>
</body>
</html>
