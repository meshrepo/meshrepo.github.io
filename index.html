<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Assets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Asset Store</h1>
            <p>Production-ready simulations, lighting setups, and 3D models.</p>
            <a href="https://instagram.com/your_handle" target="_blank" class="ig-link">@your_handle</a>
        </div>
    </header>

    <main>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="lighting">Lighting</button>
            <button class="filter-btn" data-filter="simulations">Simulations</button>
            <button class="filter-btn" data-filter="models">Models</button>
        </div>

        <div class="grid" id="product-grid">
            <!-- Asset Card 1 -->
            <div class="card" data-category="simulations">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=VDB+Explosion+Pack" alt="VDB Explosion Pack">
                <div class="card-content">
                    <h2>VDB Explosion Pack</h2>
                    <p class="price">$15.00</p>
                    <!-- Replace the href with your actual Gumroad/Stripe link -->
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>

            <!-- Asset Card 2 -->
            <div class="card" data-category="lighting">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Cinematic+Lighting+Rigs" alt="Cinematic Lighting Rigs">
                <div class="card-content">
                    <h2>Cinematic Lighting Rigs</h2>
                    <p class="price">$10.00</p>
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>

            <!-- Asset Card 3 -->
            <div class="card" data-category="models">
                <img src="https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Hard+Surface+Kitbash" alt="Hard Surface Kitbash">
                <div class="card-content">
                    <h2>Hard Surface Kitbash</h2>
                    <p class="price">$25.00</p>
                    <a href="https://gumroad.com/l/your_product_link" class="buy-btn" target="_blank">Buy Now</a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
